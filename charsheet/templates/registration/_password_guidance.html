<div class="password_guidance">
  <div class="password_strength" data-password-strength data-level="empty">
    <div class="password_strength_header">
      <span>Passwortstärke</span>
      <strong data-password-strength-label aria-live="polite">Noch nicht bewertet</strong>
    </div>
    <div class="password_strength_track" aria-hidden="true">
      <span data-password-strength-bar></span>
    </div>
  </div>
  <div class="password_policy" aria-label="Passwortbedingungen">
    <div class="password_policy_item" data-password-rule="length">
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Mindestens 8, maximal 24 Zeichen</div>
    </div>
    <div class="password_policy_item" data-password-rule="uppercase">
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Mindestens ein Großbuchstabe</div>
    </div>
    <div class="password_policy_item" data-password-rule="special">
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Mindestens ein Sonderzeichen</div>
    </div>
    <div class="password_policy_item" data-password-rule="common-password" hidden>
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Kein häufig verwendetes Passwort</div>
    </div>
    <div class="password_policy_item" data-password-rule="email-similarity" hidden>
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Keine Ähnlichkeit zur E-Mail-Adresse</div>
    </div>
    <div class="password_policy_item" data-password-rule="confirmation">
      <span class="password_policy_icon" aria-hidden="true">×</span>
      <div class="password_policy_text">Passwortbestätigung stimmt überein</div>
    </div>
  </div>
</div>
