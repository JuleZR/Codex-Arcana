<details class="workshop_accordion" data-own-inventory-settings>
  <summary>Eigene Ablage</summary>
  <div class="workshop_accordion_body">
    <input type="hidden" name="own_inventory_settings" value="1">
    <label class="shop_item_form_check">
      <input type="checkbox" name="own_inventory_enabled" value="1"{% if inventory_stat %} checked{% endif %}>
      <span>Eigene Ablage</span>
    </label>
    <p class="shop_item_form_hint">Für nicht stapelbare Einzelgegenstände. Beim Deaktivieren wird der Inhalt ins normale Inventar gelegt.</p>
    <div data-own-inventory-values>
      <label class="shop_item_form_row">
        <span>Traglast (kg)</span>
        <input type="number" name="own_inventory_capacity_kg" min="0" step="1" value="{{ inventory_stat.capacity_kg|default_if_none:'' }}" placeholder="Unbegrenzt">
      </label>
      <label class="shop_item_form_check">
        <input type="checkbox" name="own_inventory_breaks_at" value="1"{% if inventory_stat.breaks_at %} checked{% endif %}>
        <span>Breaks at</span>
      </label>
      <label class="shop_item_form_row" data-own-inventory-break-limit>
        <span>Bruchgrenze (kg)</span>
        <input type="number" name="own_inventory_breaks_at_kg" min="0" step="1" value="{{ inventory_stat.breaks_at_kg|default_if_none:'' }}">
      </label>
    </div>
  </div>
</details>
