<section class="sl-editor-card shop_magic_effect_editor" data-sl-magic-effect-editor{% if magic_editor_hidden %} hidden{% endif %}>
  <header><span>{{ magic_editor_eyebrow|default:"Optional" }}</span><h4>Magische Effekte</h4></header>
  {% if magic_editor_show_cp %}
    <label class="sl-editor-field"><span>Investierte CP</span><input name="invested_cp" type="number" min="0" step="1"{% if magic_editor_invested_cp %} value="{{ magic_editor_invested_cp }}"{% endif %}></label>
    <label class="sl-editor-field"><span>CP-Schritte</span><input name="invested_cp_steps" type="text" maxlength="200" value="{{ magic_editor_invested_cp_steps|default:'' }}" placeholder="z. B. 2/4/6/8/10"></label>
  {% endif %}
  <input type="hidden" name="magic_modifier_payloads"{% if magic_editor_payload_input_id %} id="{{ magic_editor_payload_input_id }}"{% endif %} value="{{ magic_editor_payloads|default:'[]' }}" data-sl-magic-payloads>
  <div class="sl-magic-effects shop_magic_effect_list"{% if magic_editor_list_id %} id="{{ magic_editor_list_id }}"{% endif %} data-sl-magic-effects></div>
  <div class="sl-magic-effects__actions shop_magic_effect_actions"><button type="button" class="dashboard_button dashboard_button--small shop_item_cancel_btn"{% if magic_editor_add_button_id %} id="{{ magic_editor_add_button_id }}"{% endif %} data-add-sl-magic-effect>+ Effekt hinzuf&uuml;gen</button></div>
  <template{% if magic_editor_template_id %} id="{{ magic_editor_template_id }}"{% endif %} data-sl-magic-effect-template>
    <article class="sl-magic-effect shop_magic_effect_card" data-sl-magic-effect data-magic-effect-row>
      <header class="shop_magic_effect_card_header"><button type="button" class="shop_magic_effect_drag_handle" data-drag-magic-effect aria-label="Effekt verschieben" title="Effekt verschieben">&#8942;</button><strong class="shop_magic_effect_title" data-sl-effect-title>Effekt</strong><button type="button" class="shop_step_btn shop_magic_effect_remove" data-remove-sl-magic-effect data-remove-magic-effect aria-label="Effekt entfernen">x</button></header>
      <div class="sl-editor-row sl-editor-row--effect">
        <label class="shop_item_form_row"><span>Wirkung</span><select data-effect-kind data-magic-target-kind>{% for value,label in magic_editor_effect_kinds %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
        <label class="shop_item_form_row" data-effect-value-row data-magic-value-row><span>Bonus / Malus</span><input type="number" step="1" value="0" data-effect-value data-magic-value-input></label>
        <label class="shop_item_form_row" data-effect-scale-source-row data-magic-scale-source-row><span>Skaliert nach</span><select data-effect-scale-source data-magic-scale-source><option value="">Nicht skaliert</option><option value="item_invested_cp">Investierte CP des Items</option></select></label>
        <label class="shop_item_form_row" data-effect-scale-divisor-row data-magic-scale-divisor-row hidden><span>CP pro +1/-1</span><input type="number" min="1" step="1" value="2" data-effect-scale-divisor data-magic-scale-divisor></label>
      </div>
      <label class="sl-editor-field shop_item_form_row"><span>Beschreibung</span><input type="text" maxlength="255" placeholder="Was bewirkt der Effekt?" data-effect-description data-magic-effect-description></label>
      <label class="sl-editor-field shop_item_form_row"><span>Regeltext</span><input type="text" maxlength="255" placeholder="z. B. |Passiv| gegen Gift" data-effect-rules-text data-magic-rules-text></label>
      <div class="sl-editor-row sl-editor-row--effect">
        <label class="shop_item_form_row"><span>Anzeigegruppe</span><input type="number" min="1" step="1" placeholder="z. B. 1" data-effect-display-group data-magic-display-group></label>
        <label class="sl-editor-field sl-editor-field--check shop_item_form_check shop_item_form_check--inline"><span>Gruppe</span><input type="checkbox" value="1" data-effect-display-group-append data-magic-display-group-append> <em>anh&auml;ngen</em></label>
      </div>
      <label class="sl-editor-field sl-editor-field--check shop_item_form_check shop_item_form_check--inline"><span>Itemkarte</span><input type="checkbox" value="1" data-effect-toggleable data-magic-toggleable> <em>umschaltbar</em></label>
      <label class="sl-editor-field sl-editor-field--check shop_item_form_check shop_item_form_check--inline"><span>Itemkarte</span><input type="checkbox" value="1" data-effect-toggle-inverted data-magic-toggle-inverted> <em>invertiert</em></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="attribute" data-magic-target-row="attribute" hidden><span>Attribut</span><select data-magic-target-select="attribute">{% for value,label in magic_editor_attribute_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="stat" data-magic-target-row="stat" hidden><span>Wert</span><select data-magic-target-select="stat">{% for value,label in magic_editor_stat_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="movement" data-magic-target-row="movement" hidden><span>Bewegung</span><select data-magic-target-select="movement">{% for value,label in magic_editor_movement_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="rule_flag" data-magic-target-row="rule_flag" hidden><span>Regel</span><select data-magic-target-select="rule_flag">{% for value,label in magic_editor_rule_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="skill" data-magic-target-row="skill" hidden><span>Fertigkeit</span><select data-magic-target-select="skill">{% for skill in magic_editor_skill_choices %}<option value="{{ skill.pk }}">{{ skill.name }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="category" data-magic-target-row="category" hidden><span>Fertigkeitskategorie</span><select data-magic-target-select="category">{% for category in magic_editor_category_choices %}<option value="{{ category.pk }}">{{ category.name }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="item" data-magic-target-row="item" hidden><span>Gegenstand</span><select data-magic-target-select="item">{% for item in magic_editor_item_choices %}<option value="{{ item.pk }}">{{ item.name }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="item_category" data-magic-target-row="item_category" hidden><span>Gegenstandstyp</span><select data-magic-target-select="item_category">{% for value,label in magic_editor_item_category_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
      <label class="sl-editor-field shop_item_form_row" data-effect-target="specialization" data-magic-target-row="specialization" hidden><span>Spezialisierung</span><select data-magic-target-select="specialization">{% for specialization in magic_editor_specialization_choices %}<option value="{{ specialization.pk }}">{{ specialization.name }}</option>{% endfor %}</select></label>
    </article>
  </template>
</section>
