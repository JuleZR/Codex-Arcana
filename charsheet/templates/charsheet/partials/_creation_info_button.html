<button type="button" class="school_info_btn tooltip_target" aria-label="Details zu {{ row.name }}" data-tooltip-mode="skill-card" data-tooltip-inline="off" data-tooltip-card-variant="skill" data-tooltip-title="{{ row.name }}" data-tooltip-subtitle="{{ category }}" data-tooltip-card-key="creation:{{ category|slugify }}:{% if row.slug %}{{ row.slug }}{% elif row.id %}{{ row.id }}{% else %}{{ row.name|slugify }}{% endif %}" data-tooltip="{{ row.description|default:'Keine Beschreibung hinterlegt.' }}{% if row.requirements_display %}&#10;&#10;Voraussetzungen: {{ row.requirements_display }}{% endif %}{% if row.costs_display %}&#10;&#10;Anwendung: {{ row.costs_display }}{% endif %}">i</button>
