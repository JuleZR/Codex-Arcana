{{ rune_retrofit_choices|json_script:"rune-retrofit-choices" }}
<section class="payday-window payday-window--large sheet-window sheet-window--editor-modal" id="runeRetrofitWindow" aria-hidden="true" aria-labelledby="workshopTitle">
  <div class="payday-window__titlebar sheet-window__header workshop_header" id="runeRetrofitWindowHandle">
    <div class="sheet-window__heading">
      <h3 class="payday-window__title sheet-window__title" id="workshopTitle">Die Modifikationswerkstatt</h3>
      <p>Veredle und verändere deine Ausrüstung.</p>
    </div>
    <div class="workshop_resources">
      <div>
        <span>Gegenstandswert</span>
        <strong id="workshopPrice">0 KS</strong>
      </div>
      <div>
        <span>Runenplätze</span>
        <strong id="runeRetrofitSelectionCount">0 / 5</strong>
      </div>
    </div>
    <div class="sheet-window__actions">
      <button type="button" class="payday-window__close sheet-window__close" id="runeRetrofitWindowClose" aria-label="Modifikationswerkstatt schließen">&#215;</button>
    </div>
  </div>
  <div class="payday-window__body sheet-window__body">
    <form method="post" action="" id="runeRetrofitForm" class="shop_item_form sheet-window__editor-form" enctype="multipart/form-data" data-sheet-action data-ajax-only data-close-window-on-success="1">
      {% csrf_token %}
      <input type="hidden" name="rune_payloads" id="runeRetrofitRunePayloads" value="[]">
      {% include "charsheet/partials/_item_workshop.html" %}
    </form>
  </div>
</section>
