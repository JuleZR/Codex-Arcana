<div class="creature-creation-controls">
  {% if not hide_title %}<strong>{{ choice.label }}</strong>{% endif %}
  <form method="post" action="{{ choice.create_url }}" class="creature-creation-card__form" data-sheet-action data-ajax-only>
    {% csrf_token %}<input type="hidden" name="mode" value="template">
    {% if choice.source_character_item_id %}<input type="hidden" name="source_character_item_id" value="{{ choice.source_character_item_id }}">{% endif %}
    <label>Vorlage aus der Kreaturendatenbank</label>
    <div class="creature-creation-card__template-options">
      <select name="creature_id" aria-label="Kreaturenvorlage" required>{% for creature in choice.templates %}<option value="{{ creature.pk }}" data-creature-type-id="{{ creature.creature_type_id|default:'' }}">{{ creature.display_name }}</option>{% endfor %}</select>
      {% if choice.supports_kraftbestie %}
        <label class="creature-creation-card__kraft-option">
          <input type="checkbox" name="is_kraftbestie" value="1" data-kraftbestie-tier-type-id="{{ choice.tier_type_id|default:'' }}">
          <span>als Kraftbestie</span>
        </label>
      {% endif %}
    </div>
    <button type="submit">Vorlage verwenden</button>
  </form>
  <div class="creature-creation-card__divider">oder</div>
  <button type="button" data-creature-builder-url="{% url 'creature_builder_new' %}">Kreatur erschaffen</button>
</div>
