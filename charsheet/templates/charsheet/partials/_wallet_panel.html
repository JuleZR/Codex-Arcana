<div class="p2_panel p2_wallet" id="sheetWalletPanel">
  <div class="wallet_header">
    <h2 class="wallet_title">Geldb&ouml;rse</h2>
  </div>
  <div
    class="wallet_total"
    aria-label="Geldboerse: {{ wallet_total_ks }} Kupfer"
    tabindex="0"
  >
    <span class="wallet_total__value">{{ wallet_total_ks }}</span>
    <span class="wallet_coin wallet_coin--copper wallet_coin--inline" aria-hidden="true"></span>
    <span class="wallet_conversion_tooltip" role="tooltip">
      <span class="wallet_conversion_tooltip__title">Umgerechnet</span>
      <span class="wallet_conversion_tooltip__row">
        <span>{{ wallet_gold_display }}</span>
        <span class="wallet_coin wallet_coin--gold" aria-hidden="true"></span>
      </span>
      <span class="wallet_conversion_tooltip__row">
        <span>{{ wallet_silver_display }}</span>
        <span class="wallet_coin wallet_coin--silver" aria-hidden="true"></span>
      </span>
      <span class="wallet_conversion_tooltip__row">
        <span>{{ wallet_copper_display }}</span>
        <span class="wallet_coin wallet_coin--copper" aria-hidden="true"></span>
      </span>
    </span>
  </div>
</div>
