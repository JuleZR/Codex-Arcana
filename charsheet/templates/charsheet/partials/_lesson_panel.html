<div class="p2_spells panel_scroll lesson_panel" id="sheetLessonPanel">
  <div class="spell_panel_header lesson_panel_header">
    <h2>Lektionen</h2>
  </div>

  <div class="schools_filter_row spell_filter_row">
    <input type="search" id="lessonFilterInput" class="schools_filter_input spell_filter_input" placeholder="Lektionen filtern" aria-label="Lektionen filtern">
  </div>

  <div class="panel_scroll spell_scroll">
    <div class="spell_panel_groups lesson_panel_groups">
      {% for group in lesson_panel_groups %}
        <section class="spell_group lesson_group" data-lesson-group>
          <ul class="spell_group_rows lesson_group_rows">
            {% for row in group.rows %}
              <li data-lesson-search="{{ row.search_tokens }}">
                <div
                  class="spell_cast_button lesson_card_entry tooltip_target"
                  data-lesson-card-trigger
                  tabindex="0"
                  role="button"
                  data-tooltip-side="cursor-right"
                  data-tooltip-mode="card"
                  data-tooltip-title="{{ row.name|escape }}"
                  data-tooltip-subtitle="{{ row.activation_label }}"
                  data-tooltip-persist-id="lesson:{{ row.lesson_id }}"
                  data-tooltip="{% if row.fluff_quote %}[[LESSONQUOTE]]&#10;{{ row.fluff_quote }}&#10;{% if row.fluff_quote_speaker %}[[SPEAKER:{{ row.fluff_quote_speaker }}]]&#10;{% endif %}[[/LESSONQUOTE]]&#10;&#10;{% endif %}{{ row.description|default:'Keine Beschreibung' }}&#10;&#10;Voraussetzungen: {{ row.requirements_display }}"
                  aria-label="Details zu {{ row.name }} anzeigen"
                >
                  <span class="spell_cast_name">{{ row.name }}</span>
                  <span class="spell_cast_meta">{{ row.activation_label }}</span>
                  {% if row.activation_enabled %}
                    <button
                      type="button"
                      class="spell_cast_cost lesson_cost_button"
                      data-activate-lesson
                      data-activate-url="{{ row.activation_url }}"
                      data-lesson-cost-groups="{{ row.cost_groups_json|escape }}"
                      aria-label="{{ row.name }} anwenden: {{ row.costs_display }}"
                    >
                      {{ row.costs_display }}
                    </button>
                  {% else %}
                    <span class="spell_cast_cost lesson_cost_readonly" aria-label="Anwendungskosten">{{ row.costs_display }}</span>
                  {% endif %}
                </div>
              </li>
            {% endfor %}
          </ul>
        </section>
      {% empty %}
        <p class="wm_arcana_empty">Noch keine Lektionen erlernt.</p>
      {% endfor %}
    </div>
  </div>
</div>
